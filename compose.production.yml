x-app-base: &app-base
  restart: unless-stopped
  expose: ["3000"]
  networks: [billboard-proxy]
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 30s

x-prod-build: &prod-build
  context: .
  target: production
  args:
    NEXT_PUBLIC_API_URL: ${PROD_NEXT_PUBLIC_API_URL:-/backend}
    NEXT_PUBLIC_CHAT_ENABLED: ${PROD_NEXT_PUBLIC_CHAT_ENABLED:-false}
    NEXT_PUBLIC_CHAT_URL: ${PROD_NEXT_PUBLIC_CHAT_URL:-}
    NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${PROD_NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
    NEXT_PUBLIC_CLOUDINARY_PRESET: ${PROD_NEXT_PUBLIC_CLOUDINARY_PRESET:-}

x-dev-build: &dev-build
  context: .
  target: production
  args:
    NEXT_PUBLIC_CHAT_ENABLED: ${DEV_NEXT_PUBLIC_CHAT_ENABLED:-false}
    NEXT_PUBLIC_CHAT_URL: ${DEV_NEXT_PUBLIC_CHAT_URL:-}
    NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${DEV_NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
    NEXT_PUBLIC_CLOUDINARY_PRESET: ${DEV_NEXT_PUBLIC_CLOUDINARY_PRESET:-}

services:
  billboard-db-prod:
    image: postgres:16-alpine
    profiles: [prod, prod-migrate]
    restart: unless-stopped
    # DATABASE_URL in this file must percent-encode reserved URL characters.
    # POSTGRES_PASSWORD remains the corresponding raw password.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production.local and pass --env-file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production.local and pass --env-file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production.local and pass --env-file}
    volumes: [billboard-prod-db:/var/lib/postgresql/data]
    networks: [billboard-prod-db]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  billboard-prod:
    <<: *app-base
    image: billboard-app:prod-${BILLBOARD_IMAGE_TAG:-local}
    profiles: [prod]
    build: *prod-build
    env_file: [.env.production.local]
    environment:
      POSTGRES_USER: null
      POSTGRES_PASSWORD: null
      POSTGRES_DB: null
      NEXT_PUBLIC_API_URL: /backend
      BACKEND_API_URL: http://billboard-backend-prod:4001
      PRIVATE_UPLOAD_STORAGE_ROOT: /app/uploads/private/designs
    depends_on:
      billboard-db-prod:
        condition: service_healthy
    volumes: [billboard-prod-uploads:/app/uploads/private/designs]
    networks: [billboard-prod-db, billboard-proxy, billboard-egress]

  billboard-backend-prod:
    image: billboard-backend:prod-${BILLBOARD_IMAGE_TAG:-local}
    profiles: [prod]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: [.env.production.local]
    environment:
      POSTGRES_USER: null
      POSTGRES_PASSWORD: null
      POSTGRES_DB: null
      FRONTEND_URL: https://billboard.uteroindonesia.com
      NEXTAUTH_URL: https://billboard.uteroindonesia.com
    expose: ["4001"]
    depends_on:
      billboard-db-prod:
        condition: service_healthy
    volumes: [billboard-prod-backend-uploads:/app/backend/public/uploads/designs]
    networks: [billboard-prod-db, billboard-proxy, billboard-egress]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4001/api/billboards').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  billboard-migrate-prod:
    image: billboard-app:migrate-prod-${BILLBOARD_IMAGE_TAG:-local}
    profiles: [prod-migrate]
    build:
      <<: *prod-build
      target: migrator
    restart: "no"
    command: [npx, prisma, migrate, deploy]
    env_file: [.env.production.local]
    environment:
      POSTGRES_USER: null
      POSTGRES_PASSWORD: null
      POSTGRES_DB: null
    depends_on:
      billboard-db-prod:
        condition: service_healthy
    networks: [billboard-prod-db]

  billboard-db-dev:
    image: postgres:16-alpine
    profiles: [dev, dev-migrate]
    restart: unless-stopped
    # Keep credentials and URLs distinct from production. Encode reserved URL
    # characters only inside DATABASE_URL, not POSTGRES_PASSWORD.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.development.local and pass --env-file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.development.local and pass --env-file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.development.local and pass --env-file}
    volumes: [billboard-dev-db:/var/lib/postgresql/data]
    networks: [billboard-dev-db]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  billboard-dev:
    <<: *app-base
    image: billboard-app:dev-${BILLBOARD_IMAGE_TAG:-local}
    profiles: [dev]
    build: *dev-build
    env_file: [.env.development.local]
    environment:
      POSTGRES_USER: null
      POSTGRES_PASSWORD: null
      POSTGRES_DB: null
    depends_on:
      billboard-db-dev:
        condition: service_healthy
    volumes: [billboard-dev-uploads:/app/uploads/private/designs]
    networks: [billboard-dev-db, billboard-proxy]

  billboard-migrate-dev:
    image: billboard-app:migrate-dev-${BILLBOARD_IMAGE_TAG:-local}
    profiles: [dev-migrate]
    build:
      <<: *dev-build
      target: migrator
    restart: "no"
    command: [npx, prisma, migrate, deploy]
    env_file: [.env.development.local]
    environment:
      POSTGRES_USER: null
      POSTGRES_PASSWORD: null
      POSTGRES_DB: null
    depends_on:
      billboard-db-dev:
        condition: service_healthy
    networks: [billboard-dev-db]

  billboard-nginx:
    image: nginx:stable-alpine
    profiles: [proxy]
    restart: unless-stopped
    ports: [127.0.0.1:18087:80]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - billboard-proxy
      - carubra-network
      - maskhar-network
      - utero-id-network
      - uteroindonesia-network
      - n8n-host_automation-network

volumes:
  billboard-prod-db:
  billboard-prod-uploads:
  billboard-prod-backend-uploads:
  billboard-dev-db:
  billboard-dev-uploads:

networks:
  billboard-prod-db:
    internal: true
    ipam:
      config:
        - subnet: 10.253.1.0/24
  billboard-dev-db:
    internal: true
    ipam:
      config:
        - subnet: 10.253.2.0/24
  billboard-egress:
    driver: bridge
  billboard-proxy:
    internal: true
    ipam:
      config:
        - subnet: 10.253.3.0/24
  n8n-host_automation-network:
    external: true
    name: n8n-host_automation-network
  carubra-network:
    external: true
    name: carubra-network
  maskhar-network:
    external: true
    name: maskhar-network
  utero-id-network:
    external: true
    name: utero-id-network
  uteroindonesia-network:
    external: true
    name: uteroindonesia-network
